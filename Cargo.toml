[package]
name = "olink-plugin-xgimi"
version = "0.1.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/huan-xi/olink-plugin-xgimi"

[lib]
name = "olink_plugin_xgimi"
path = "src/lib.rs"

[[bin]]
name = "olink-plugin-xgimi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
